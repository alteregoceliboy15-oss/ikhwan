<!DOCTYPE html>
<html>
<head>
    <title>Stock Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Pengurusan Stock</h1>

<div class="product">
    <h2>Sock</h2>
    <p>Stock: <span id="sock-stock">0</span></p>
    <button onclick="addStock('sock')">+ Tambah</button>
    <button onclick="removeStock('sock')">- Tolak</button>
</div>

<div class="product">
    <h2>Handsock Nawla</h2>
    <p>Stock: <span id="handsock-stock">0</span></p>
    <button onclick="addStock('handsock')">+ Tambah</button>
    <button onclick="removeStock('handsock')">- Tolak</button>
</div>

<script src="script.js"></script>
</body>
</html>
